<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>얼굴 이미지 평가 | 스마트팩토리 비전 프로젝트</title><link rel="stylesheet" href="./css/styles.css"></head>
<body>
<main class="app">
<header class="topbar"><a class="wordmark" href="./" aria-label="비전 프로젝트 홈"><span class="mark">V</span> VISION PROJECT</a><span class="edition">2조</span></header>
<section class="intro"><div class="eyebrow">현대오토에버 모빌리티 SW스쿨 · 스마트팩토리</div><h1>얼굴 이미지 평가</h1><div class="model-badges"><span id="model-badge">DenseNet121</span><span>예측 점수 1–5</span></div></section>
<div class="model-picker"><label for="model-select">분석 모델</label><select id="model-select" disabled><option value="">모델 확인 중…</option></select></div>
<section class="studio" aria-label="사진 스튜디오">
<div class="hero-art" id="hero">
<svg class="portrait" viewBox="0 0 340 300" role="img" aria-label="얼굴을 담은 따뜻한 색감의 추상 일러스트">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e9cab1"/><stop offset="1" stop-color="#f7e5d4"/></linearGradient></defs>
<rect x="62" y="12" width="216" height="268" rx="108" fill="url(#bg)"/>
<path d="M72 278c6-62 43-79 98-79s94 24 101 79" fill="#5478b1"/>
<path d="M127 203v-43h82v43c-14 29-66 26-82 0" fill="#db9a79"/>
<path d="M106 121c-23-85 95-128 130-43 17 42 1 75 1 99-24-4-128 27-139-10" fill="#253d60"/>
<ellipse cx="174" cy="132" rx="59" ry="76" fill="#efb393"/>
<path d="M115 111c31-1 60-25 66-48 1 23 29 42 53 41-1-43-25-70-63-66-43 3-61 32-56 73" fill="#253d60"/>
<path d="M137 125q11-7 21 0m32 0q11-7 21 0" fill="none" stroke="#554337" stroke-width="3" stroke-linecap="round"/>
<path d="M175 131l-5 21h8m-17 16q14 10 28-1" fill="none" stroke="#b46d53" stroke-width="3" stroke-linecap="round"/>
<circle cx="140" cy="149" r="10" fill="#df8e77" opacity=".45"/><circle cx="205" cy="149" r="10" fill="#df8e77" opacity=".45"/>
<path d="M59 88v-14m-7 7h14m212 93v-20m-10 10h20" stroke="#4c77b0" stroke-width="2" stroke-linecap="round"/>
<circle cx="277" cy="56" r="5" fill="none" stroke="#a67e5d" stroke-width="2"/>
</svg>
</div>
<div id="photo-panel" class="photo-panel" hidden><img id="photo" alt="선택한 사진 미리보기"><span class="photo-tag">선택한 이미지</span><button id="remove" class="icon-button" aria-label="사진 삭제" title="사진 삭제">×</button><div class="photo-bottom"><span id="filename"></span><span id="dimensions"></span></div></div>
<div class="studio-foot"><span class="small-dot"></span><span id="studio-caption">정면 얼굴 사진 · 한 사람</span></div>
</section>
<section id="result" class="result-card" aria-live="polite" hidden>
<span class="result-label">AI 예측 점수</span>
<div class="result-score"><strong id="score">—</strong><span> / 5.00</span></div>
<meter id="score-meter" min="1" max="5" value="1" aria-label="예측 점수"></meter>
<p id="result-model"></p>
</section>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section class="actions" aria-label="사진 선택">
<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<button id="upload" class="button primary"><span class="button-icon">↥</span><span id="upload-label">사진 선택하기</span><span class="arrow">↗</span></button>
<button id="camera" class="button secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l2-3h4l2 3h4v14H4V6z"/><circle cx="12" cy="12" r="4"/></svg>카메라로 촬영하기</button>
<div id="selected-actions" hidden><button id="analyze" class="button analyze" disabled>점수 확인</button><button id="download" class="text-button">선택한 사진 PNG로 저장 <span>↓</span></button></div>
</section>
<div class="privacy"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="8" width="10" height="9" rx="2"/><path d="M7 8V5a3 3 0 016 0v3"/></svg><span>사진은 이 PC에서 분석되며 저장되지 않습니다.</span></div>

<footer><span>스마트팩토리 과정</span><span>2조 · 머신 비전 프로젝트</span></footer>
</main>
<dialog id="camera-dialog"><div class="dialog-header"><div><h2>얼굴 사진 촬영</h2></div><button id="close-camera" class="icon-button" aria-label="카메라 닫기">×</button></div><div class="video-wrap"><video id="video" autoplay muted playsinline></video><div class="face-guide"></div></div><p id="camera-status" role="status">카메라를 연결하고 있어요…</p><button id="capture" class="button primary" disabled>사진 촬영하기</button></dialog>
<script type="module" src="./js/app.js"></script>
</body></html>
